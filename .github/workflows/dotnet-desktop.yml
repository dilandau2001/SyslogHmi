name: .NET 10 Windows Build & Release

on:
  push:
    branches: [ "master" ]

# Otorga explícitamente permisos de escritura para que el script pueda crear la Release sin errores
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release] # Solo Release para producción

    runs-on: windows-latest  

    env:
      Solution_Name: SyslogHmi.sln                              
      Test_Project_Path: SyslogHmiTests/SyslogHmiTests.csproj
      Main_Project_Path: SyslogHmi/SyslogHmi.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 1. Descarga todas las dependencias necesarias de NuGet
    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    # 2. Compila la solución completa de una sola vez
    - name: Build Solution
      run: dotnet build ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-restore

    # 3. Ejecuta los tests usando lo que ya se compiló en el paso anterior (--no-build)
    - name: Execute unit tests
      run: dotnet test ${{ env.Test_Project_Path }} --configuration ${{ matrix.configuration }} --no-build

    # 4. Publica la aplicación limpia usando la compilación previa (--no-build)
    - name: Publish Application
      run: dotnet publish ${{ env.Main_Project_Path }} --configuration ${{ matrix.configuration }} --output ./publish_output --no-build

    # 5. Empaqueta el resultado en un archivo ZIP
    - name: Create Zip Archive
      shell: pwsh
      run: Compress-Archive -Path ./publish_output/* -DestinationPath ./SyslogHmi_v1.0.0.zip

    # 6. Publica en la sección de Releases de GitHub de forma automática
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh
      run: |
        gh release create v1.0.0 ./SyslogHmi_v1.0.0.zip `
          --title "Version 1.0.0 (Initial Release)" `
          --notes "First official release of SyslogHmi built on .NET 10." `
          --target master
