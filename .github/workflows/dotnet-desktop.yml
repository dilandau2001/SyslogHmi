name: .NET 10 Windows Build & Release

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release] # Changed to Release only for production delivery

    runs-on: windows-latest  

    env:
      Solution_Name: SyslogHmi.sln                              
      Test_Project_Path: SyslogHmiTests/SyslogHmiTests.csproj   

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    - name: Execute unit tests
      run: dotnet test ${{ env.Test_Project_Path }} --configuration ${{ matrix.configuration }} --no-restore

    # Optimized for Release: Publishes the app into a clean, single zip-ready folder
    - name: Publish Application
      run: dotnet publish ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --output ./publish_output --no-restore

    # Compresses the published folder into a single ZIP file for clean downloading
    - name: Create Zip Archive
      shell: pwsh
      run: Compress-Archive -Path ./publish_output/* -DestinationPath ./SyslogHmi_v1.0.0.zip

    # Uploads the zip as an internal GitHub Artifact (Good for backup)
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Application-Package
        path: ./SyslogHmi_v1.0.0.zip

    # Automatically creates the formal GitHub Release and attaches the ZIP
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Provided automatically by GitHub Actions
      shell: pwsh
      run: |
        gh release create v1.0.0 ./SyslogHmi_v1.0.0.zip `
          --title "Version 1.0.0 (Initial Release)" `
          --notes "First official release of SyslogHmi built on .NET 10." `
          --target master
